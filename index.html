<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernkasten</title>
<meta name="description" content="Englisch-Vokabeln und deutsche Rechtschreibung üben">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernkasten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF2F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1528" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@500;700;800&family=Patrick+Hand&display=swap">
<style>
/* Layout: eine schmale Spalte wie ein Schulheft; die Karteikarte steht im Mittelpunkt, der Karteikasten (5 Fächer) zeigt den Fortschritt */
:root{
  --paper:#EEF2F9; --surface:#FFFFFF; --ink:#16213B; --muted:#5A6885; --line:#D3DCEB;
  --accent:#2756DB; --accent-soft:#DFE7FB; --on-accent:#FFFFFF;
  --card-line:#CADAF2; --card-rule:#E0544B;
  --good:#17895A; --good-bg:#E0F3E9; --bad:#C93A31; --bad-bg:#FBE6E3;
  --mark:#FFDB3D; --shadow:0 1px 2px rgba(22,33,59,.08),0 6px 18px rgba(22,33,59,.08);
  --blue:#2756DB; --blue-soft:#DFE7FB; --blue-line:#CADAF2; --green:#16803F; --green-soft:#DCF1E3; --green-line:#C5E4CF; --book-green:#6FA94A; --book-green-ink:#3F7A22;
  --f-display:"Bricolage Grotesque","Avenir Next","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",-apple-system,system-ui,"Segoe UI",sans-serif;
  --f-hand:"Patrick Hand","Chalkboard SE","Comic Neue","Segoe Print",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0F1528; --surface:#19223B; --ink:#E7ECF6; --muted:#9AA7C2; --line:#2B3757;
  --accent:#7393FF; --accent-soft:#25335E; --on-accent:#0F1528;
  --card-line:#2A3961; --card-rule:#E8736B;
  --good:#52CC91; --good-bg:#143426; --bad:#F2847B; --bad-bg:#3B1D1D;
  --mark:#E5C02F; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
  --blue:#7393FF; --blue-soft:#25335E; --blue-line:#2A3961; --green:#4FCB85; --green-soft:#173826; --green-line:#244A36; --book-green:#5E9440; --book-green-ink:#8FCB6A;
  color-scheme:dark}}
:root{ --orange:#C2540A; --orange-soft:#FDE6D5; --orange-line:#F4D2B8; --purple:#7A3FD1; --purple-soft:#ECE2FB; --purple-line:#DCCCF5 }
@media (prefers-color-scheme: dark){:root{ --orange:#F59A5B; --orange-soft:#3D2716; --orange-line:#4D3420; --purple:#B48CFF; --purple-soft:#2F2350; --purple-line:#3C2E63 }}
.acc-blue{--accent:var(--blue);--accent-soft:var(--blue-soft);--card-line:var(--blue-line)}
.acc-green{--accent:var(--green);--accent-soft:var(--green-soft);--card-line:var(--green-line)}
.acc-orange{--accent:var(--orange);--accent-soft:var(--orange-soft);--card-line:var(--orange-line)}
.acc-purple{--accent:var(--purple);--accent-soft:var(--purple-soft);--card-line:var(--purple-line)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;overscroll-behavior-y:none}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding-top:max(18px,env(safe-area-inset-top,0px));padding-bottom:max(40px,calc(env(safe-area-inset-bottom,0px) + 24px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack-s{display:flex;flex-direction:column;gap:6px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.brand svg{flex:none}

button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:800;min-height:50px;transition:transform .08s ease}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line)}
.btn-link{padding:8px 4px;color:var(--accent);font-weight:800;min-height:44px}
.btn-wide{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}

/* wer übt */
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kid{background:var(--surface);border:1.5px solid var(--line);border-top:6px solid var(--accent);border-radius:16px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.3rem;background:var(--accent-soft);color:var(--accent)}
.kid strong{font-family:var(--f-display);font-size:1.25rem}
.kid-add{border-style:dashed;border-top:1.5px dashed var(--line);box-shadow:none;background:transparent}
.kid-add .avatar{background:var(--line);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px}
.field input{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:1.1rem;width:100%}
.field input:focus{border-color:var(--accent);outline:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;min-height:44px}
.swatch i{width:16px;height:16px;border-radius:50%;background:var(--accent)}
.swatch[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.btn-bad{background:var(--bad);color:var(--surface)}
textarea.code{width:100%;min-height:96px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;resize:vertical}
textarea.code:focus{border-color:var(--accent);outline:none}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 12px;font-weight:700}

/* Zahlen */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}

/* Karteikasten */
.box{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end}
.fach{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.fach .stack{width:100%;height:70px;border-radius:8px 8px 4px 4px;background:var(--paper);border:1px solid var(--line);position:relative;overflow:hidden}
.fach .fill{position:absolute;left:0;right:0;bottom:0;background:repeating-linear-gradient(to top,var(--accent) 0 3px,var(--accent-soft) 3px 5px)}
.fach.new .fill{background:repeating-linear-gradient(to top,var(--muted) 0 3px,var(--line) 3px 5px)}
.fach .n{font-weight:800;font-variant-numeric:tabular-nums;font-size:.9rem}
.fach .t{font-size:.7rem;color:var(--muted);font-weight:700;text-align:center;line-height:1.1}

/* Seitenauswahl */
.unitgroup{display:flex;flex-direction:column;gap:10px;padding-block:14px;border-top:1px solid var(--line)}
.unitgroup:first-child{border-top:0;padding-top:0}
.unithead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.unithead h3{min-width:0}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.pg{display:flex;flex-direction:column;align-items:flex-start;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);text-align:left;min-height:54px}
.pg b{font-family:var(--f-display);font-size:1.05rem;font-variant-numeric:tabular-nums;line-height:1.2}
.pg span{font-size:.72rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.pg[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pg[aria-pressed="true"] span{color:var(--ink)}
.range{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.range input{width:88px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;font-variant-numeric:tabular-nums}
.range input:focus{border-color:var(--accent);outline:none}
.sticky{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;z-index:5}
.chosen{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-weight:700}
.hint{color:var(--bad);font-weight:700}
.greenbox{border:2px solid var(--book-green);border-radius:12px;overflow:hidden;background:var(--surface)}
.greenbox .label{display:block;padding:8px 14px;background:var(--book-green);color:#fff;letter-spacing:.04em}
.gwords{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px 12px}
.gwords span{font-weight:700}
.choicecol{display:flex;flex-direction:column;gap:10px}
.choicebtn{flex-direction:column;align-items:center;gap:2px;min-height:64px}
.choicebtn span{font-weight:700;font-size:.85rem;opacity:.85}
.gtag{color:var(--book-green-ink)}
.counter{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:12px}
.cbtn{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1}
.cbtn[disabled]{opacity:.35;cursor:default}
.cval{display:flex;flex-direction:column;align-items:center}
.cval b{font-family:var(--f-display);font-size:3.2rem;font-weight:800;line-height:1.05;color:var(--accent)}
.cval span{font-size:.85rem;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;min-height:44px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* Üben */
.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.card{position:relative;border-radius:10px;box-shadow:var(--shadow);min-height:190px;padding:16px 18px 18px;
  background:linear-gradient(var(--card-rule),var(--card-rule)) 0 50px/100% 2px no-repeat,
             repeating-linear-gradient(to bottom,transparent 0 35px,var(--card-line) 35px 36px) 0 52px/100% calc(100% - 52px) no-repeat,
             var(--surface);
  display:flex;flex-direction:column;gap:6px}
.card .head{display:flex;justify-content:space-between;align-items:center;height:26px;gap:8px}
.card .fachtag{font-size:.75rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.card .word{font-family:var(--f-hand);font-size:2.1rem;line-height:36px;padding-top:20px;overflow-wrap:anywhere}
.card .answer{font-family:var(--f-hand);font-size:1.9rem;line-height:36px;color:var(--accent);overflow-wrap:anywhere;animation:pop .25s ease}
.wordline{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.speak{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.verdict{border-radius:10px;padding:8px 12px;font-weight:700;margin-top:6px}
.verdict.right{background:var(--good-bg);color:var(--good)}
.verdict.wrong{background:var(--bad-bg);color:var(--bad)}
.verdict s{color:var(--ink);text-decoration-color:var(--bad)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.answerbox{display:flex;gap:8px}
.answerbox input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:1.15rem}
.answerbox input:focus{border-color:var(--accent);outline:none}
.answerbox .btn{min-width:96px}

/* Ergebnis */
.result{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.result div{border-radius:12px;padding:12px;text-align:center}
.result b{display:block;font-family:var(--f-display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.r1{background:var(--good-bg);color:var(--good)}.r3{background:var(--bad-bg);color:var(--bad)}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wlist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.wlist li:last-child{border-bottom:0}
.wlist .en{font-weight:800;min-width:0;overflow-wrap:anywhere}
.wlist .de{color:var(--muted);text-align:right;min-width:0;overflow-wrap:anywhere}
.highlight{background:linear-gradient(transparent 55%,var(--mark) 55%);padding:0 2px}
.note{font-size:.85rem;color:var(--muted)}
.foot{font-size:.8rem;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:var(--shadow);z-index:20;max-width:calc(100% - 32px)}
/* Fächer */
.subjects{display:flex;flex-direction:column;gap:12px}
.subject{display:flex;align-items:center;gap:14px;background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--accent);border-radius:16px;padding:16px;text-align:left;box-shadow:var(--shadow);width:100%}
.subject .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:800;font-size:1.15rem;flex:none}
.subject strong{font-family:var(--f-display);font-size:1.25rem;display:block;line-height:1.2}
.subject .sub{font-size:.85rem;color:var(--muted);display:block}
.subject .due{display:inline-block;margin-top:4px;font-size:.8rem;font-weight:800;color:var(--accent)}
.subject .go{margin-left:auto;font-size:1.6rem;color:var(--muted);flex:none}
/* Rechtschreibung */
.topiclist{display:flex;flex-direction:column;gap:8px}
.topic{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;min-height:54px;width:100%}
.topic[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.topic b{font-weight:800;display:block}
.topic small{font-size:.78rem;color:var(--muted);font-weight:700}
.topic .cnt{font-size:.8rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.topic.mine{border-style:dashed}
.listen{display:flex;gap:10px;flex-wrap:wrap;padding-top:22px}
.listen .btn{flex:1 1 150px}
.parts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.parts .chip{min-height:40px;padding:6px 14px}
.tip{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:.9rem;margin-top:6px}
.card .answer mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 1px}
.ctx{color:var(--muted);font-size:.95rem}
.dictbox{display:flex;flex-direction:column;gap:8px}
.dictbox textarea{width:100%;min-height:104px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:1.15rem/1.45 var(--f-body);resize:none}
.dictbox textarea:focus{border-color:var(--accent);outline:none}
.sent{font-family:var(--f-hand);font-size:1.4rem;line-height:36px;overflow-wrap:anywhere}
.sent .bad{background:var(--bad-bg);color:var(--bad);border-radius:4px;padding:0 2px;text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.sent .pun{background:var(--mark);color:var(--ink);border-radius:4px;padding:0 3px}
.sent .gap{display:inline-block;min-width:1.2em;border-bottom:2px solid var(--bad)}
.sentlabel{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:8px}
.verdict.half{background:var(--orange-soft);color:var(--orange)}
.dlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.dlist li{border-bottom:1px dashed var(--line);padding-bottom:10px}
.dlist li:last-child{border-bottom:0}
.dlist .sent{font-size:1.25rem;line-height:1.5}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app acc-blue" id="app" aria-live="polite"></div>
<div class="toast" id="toast" hidden></div>
<script src="vocab.js"></script>
<script src="deutsch.js"></script>
<script>
(() => {
const DAY = 86400000;
const INTERVAL = [0, 0, 1, 3, 7, 14];          // Tage bis zur nächsten Wiederholung je Fach (0 = neu)
const FACH_NAME = ['Neu','Fach 1','Fach 2','Fach 3','Fach 4','Fach 5'];
const COLORS = {blue:'Blau', green:'Grün', orange:'Orange', purple:'Lila'};
const UNITS = (window.VOCAB || []);
const KEY = 'vokabelkasten.v1';

/* ---------- helpers ---------- */
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dayStr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => dayStr(new Date());
const yesterday = () => dayStr(new Date(Date.now()-DAY));
const startOfDay = () => { const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pageLabel = p => p ? 'S. '+p : 'ohne Seite';
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

/* ---------- Speicher: alles bleibt auf diesem Gerät ---------- */
/* Profile (Name, Farbe) und Lernstand liegen nur im Speicher dieses Geräts, nie im Code. */
const store = lsGet(KEY) || {};
store.profiles = Array.isArray(store.profiles) ? store.profiles.filter(p=>p&&p.id&&p.name) : [];
store.kids = store.kids || {}; store.pages = store.pages || {};
for(const p of store.profiles) if(!store.kids[p.id]) store.kids[p.id] = {xp:0, streak:0, lastDay:'', p:{}};
for(const id in store.kids){ const k=store.kids[id]; k.d=k.d||{}; k.dx=k.dx||{}; k.dt=k.dt||{}; }
const profileOf = id => store.profiles.find(p=>p.id===id);
const colorOf = p => p && COLORS[p.color] ? p.color : 'blue';
function createProfile(name, color){
  const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

/* ---------- Prüfung: streng, keine Tippfehler-Toleranz ----------
   Egal sind nur Groß-/Kleinschreibung, Leerzeichen am Rand und Satzzeichen (. , ! ? "). */
function norm(s){
  return (s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/…/g,'...').replace(/[.,!?"“”„]/g,'').replace(/\s+/g,' ').trim();
}
function variants(s){ return [norm(s.replace(/\([^)]*\)/g,' ')), norm(s.replace(/[()]/g,''))]; }
const synonyms = new Map();   // gleiches deutsches Wort -> alle englischen Lösungen
for(const u of UNITS) for(const w of u.words){ const k=norm(w.de); if(!synonyms.has(k)) synonyms.set(k,[]); synonyms.get(k).push(w.en,...(w.alt||[])); }
function checkAnswer(input, w){
  const a=norm(input); if(!a) return 'wrong';
  const answers=[w.en,...(w.alt||[]),...(synonyms.get(norm(w.de))||[])];
  return answers.some(x=>variants(x).includes(a)) ? 'right' : 'wrong';
}

}

/* ---------- Lernlogik ---------- */
const ALL = []; UNITS.forEach(u=>u.words.forEach(w=>ALL.push({key:u.id+':'+w.id, w})));
const wordsOnPages = pages => ALL.filter(x=>pages.has(x.w.page||0));
const boxOf = (k,key) => (k&&k.p&&k.p[key])||{b:0,due:0};
const isDue = p => p.b===0 || (p.due||0)<=Date.now();
function boxCounts(k){ const c=[0,0,0,0,0,0]; ALL.forEach(x=>c[boxOf(k,x.key).b]++); return c; }
const reviewCount = k => ALL.filter(x=>{const p=boxOf(k,x.key); return p.b>0 && isDue(p);}).length;
const PAGE_INDEX = UNITS.map(u=>{
  const m=new Map(); u.words.forEach(w=>{ const p=w.page||0; m.set(p,(m.get(p)||0)+1); });
  return {unit:u, pages:[...m.entries()].sort((a,b)=>a[0]-b[0]).map(([page,count])=>({page,count}))};
});
function pagesSummary(set){
  const ps=[...set].sort((a,b)=>a-b); if(!ps.length) return '';
  const parts=[]; let s=ps[0], prev=ps[0];
  for(const p of ps.slice(1).concat([null])){
    if(p!==null && p===prev+1){ prev=p; continue; }
    parts.push(s===0?'ohne Seite':(s===prev?'S. '+s:'S. '+s+'–'+prev)); if(p!==null){ s=p; prev=p; }
  }
  return parts.join(', ');
}
/* Mindestens 20 Vokabeln pro Übung; welche es sind, entscheidet der Zufall. */
const MIN_WORDS = 20, STEP = 5;
function clampCount(n, total){ return Math.max(MIN_WORDS, Math.min(total, Math.round(n)||MIN_WORDS)); }
/* Grüne Kästen: vor jeder Übung wird gefragt, ob ihre Vokabeln mit abgefragt werden. */
const boxWordsOnPages = () => wordsOnPages(S.pages).filter(x=>x.w.box);
const practicePool = () => wordsOnPages(S.pages).filter(x=>S.withBox || !x.w.box);
/* Mindestens 20 gilt nur, wenn die Anzahl gewählt wird. Wer die grünen Kästen weglässt,
   übt einfach alle übrigen Vokabeln der Seiten, egal wie viele es sind. */
function pageCheck(){
  const sel=wordsOnPages(S.pages), box=sel.filter(x=>x.w.box).length, rest=sel.length-box;
  return {total:sel.length, box, rest, ok: sel.length>=MIN_WORDS || (box>0 && rest>0)};
}
function afterPages(){
  if(!pageCheck().ok){ toast(`Wähle Seiten mit mindestens ${MIN_WORDS} Vokabeln aus.`); return null; }
  store.pages[S.kidId]=[...S.pages]; save();
  if(boxWordsOnPages().length){ S.withBox=null; return 'boxes'; }
  S.withBox=false; return openCount() ? 'count' : null;
}
function openCount(){
  const total=practicePool().length;
  if(total<MIN_WORDS){ toast(`Wähle Seiten mit mindestens ${MIN_WORDS} Vokabeln aus.`); return false; }
  S.count=clampCount((store.counts||{})[S.kidId]||MIN_WORDS, total); S.countTotal=total; return true;
}
/* Gewichteter Zufall: falsch beantwortete (Fach 1) und fällige Vokabeln kommen öfter dran,
   neue normal, noch nicht fällige selten. Jede Vokabel bleibt möglich. */
const WEIGHT = {wrong:6, due:4, fresh:2, later:1};
function wordKind(k, x){
  const p=boxOf(k,x.key);
  if(p.b===0) return 'fresh';
  if(p.b===1) return 'wrong';
  return isDue(p) ? 'due' : 'later';
}
function weightedPick(pool, n, k){
  // Efraimidis-Spirakis: Schlüssel = Zufall^(1/Gewicht), die n größten werden gezogen
  return pool.map(x=>({x, key:Math.pow(Math.random(), 1/WEIGHT[wordKind(k,x)])}))
    .sort((a,b)=>b.key-a.key).slice(0,n).map(o=>o.x);
}
function startSession(){
  const pool=practicePool();
  if(pool.length<MIN_WORDS){ toast(`Wähle Seiten mit mindestens ${MIN_WORDS} Vokabeln aus.`); return false; }
  const n=clampCount(S.count, pool.length);
  store.counts=store.counts||{}; store.counts[S.kidId]=n; save();
  S.sess={items:shuffle(weightedPick(pool, n, kidData())), i:0, res:[], verdict:null};
  S.view='practice'; return true;
}
function startWithoutBoxes(){
  const pool=wordsOnPages(S.pages).filter(x=>!x.w.box);
  if(!pool.length){ toast('Auf diesen Seiten stehen nur Vokabeln aus grünen Kästen.'); return false; }
  S.sess={items:shuffle(pool.slice()), i:0, res:[], verdict:null};
  S.view='practice'; return true;
}
function startRetry(){
  const wrong=S.sess.res.filter(r=>r.r!=='right').map(r=>r.item);
  S.sess={items:shuffle(wrong), i:0, res:[], verdict:null};
  S.view='practice';
}
function grade(r, typed){
  const s=S.sess, it=s.items[s.i], k=kidData();
  const p=k.p[it.key]||{b:0,due:0}; let b=p.b;
  b = r==='right' ? (b===0 ? 2 : Math.min(5,b+1)) : 1;
  k.p[it.key]={b, due:startOfDay()+INTERVAL[b]*DAY};
  k.xp=(k.xp||0)+(r==='right'?10:0);
  touchDay(k);
  s.verdict={item:it,r,from:p.b,to:b,typed}; s.res.push(s.verdict); save();
}

/* ---------- Sicherung: exportieren und importieren ----------
   Format: {app:'vokabelkasten', v:1, date, profiles:[{name,color,xp,streak,lastDay,pages,p:{wortId:[fach, fälligInMinuten]}}]}
   Als Datei (JSON) oder als Code "VK1:" + Base64. */
const WORD_KEY = new Map(ALL.map(x=>[x.w.id, x.key]));
function buildBackup(){
  return {app:'vokabelkasten', v:2, date:new Date().toISOString(), profiles:store.profiles.map(pr=>{
    const k=store.kids[pr.id]||{}; const p={};
    for(const [key,val] of Object.entries(k.p||{})){ const wid=key.split(':').pop(); p[wid]=[val.b, Math.round((val.due||0)/60000)]; }
    const d={}; for(const [key,val] of Object.entries(k.d||{})) d[key]=[val.b, Math.round((val.due||0)/60000)];
    return {name:pr.name, color:colorOf(pr), xp:k.xp||0, streak:k.streak||0, lastDay:k.lastDay||'', pages:store.pages[pr.id]||[], p, d, dx:k.dx||{}, dt:k.dt||{}};
  })};
}
const fromB64 = s => new TextDecoder().decode(Uint8Array.from(atob(s), c=>c.charCodeAt(0)));
function backupCode(){ const json=JSON.stringify(buildBackup()); let bin=''; const bytes=new TextEncoder().encode(json);
  for(let i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode(...bytes.subarray(i,i+8192)); return 'VK1:'+btoa(bin); }
function parseBackup(text){
  let t=(text||'').trim(); if(!t) throw new Error('Die Sicherung ist leer.');
  if(/^VK1:/i.test(t)){ try{ t=fromB64(t.slice(4).replace(/\s+/g,'')); }catch(e){ throw new Error('Der Code ist unvollständig oder fehlerhaft. Kopiere ihn bitte noch einmal ganz.'); } }
  let obj; try{ obj=JSON.parse(t); }catch(e){ throw new Error('Das ist keine gültige Sicherung. Prüfe, ob der Code vollständig eingefügt ist.'); }
  if(!obj || obj.app!=='vokabelkasten' || !Array.isArray(obj.profiles)) throw new Error('Das ist keine Sicherung vom Lernkasten.');
  const profiles=obj.profiles.filter(p=>p && typeof p.name==='string' && p.name.trim()).map(p=>{
    const prog={}; let n=0;
    for(const [wid,val] of Object.entries(p.p||{})){ const key=WORD_KEY.get(wid); if(!key||!Array.isArray(val)) continue;
      const b=Math.max(0,Math.min(5,parseInt(val[0],10)||0)); if(!b) continue; prog[key]={b, due:(+val[1]||0)*60000}; n++; }
    const dx={}; if(p.dx && typeof p.dx==='object') for(const [w,v] of Object.entries(p.dx)) if(w && v && typeof v.s==='string') dx[w.slice(0,40)]={s:v.s.slice(0,300), f:!!v.f};
    const d={}; let dn=0;
    if(p.d && typeof p.d==='object') for(const [key,val] of Object.entries(p.d)){ if(!Array.isArray(val)) continue;
      if(!(key.startsWith('d:') && DKEY.has(key)) && !(key.startsWith('x:') && dx[key.slice(2)])) continue;
      const b=Math.max(0,Math.min(5,parseInt(val[0],10)||0)); if(!b) continue; d[key]={b, due:(+val[1]||0)*60000}; dn++; }
    const dt={}; if(p.dt && typeof p.dt==='object') for(const [key,val] of Object.entries(p.dt)) if(+val>0) dt[key]=+val;
    return {name:p.name.trim().slice(0,24), color:COLORS[p.color]?p.color:'blue', xp:Math.max(0,+p.xp||0), streak:Math.max(0,+p.streak||0),
      lastDay:typeof p.lastDay==='string'?p.lastDay:'', pages:Array.isArray(p.pages)?p.pages.filter(x=>Number.isInteger(x)):[], p:prog, learned:n, d, dx, dt, dlearned:dn};
  });
  if(!profiles.length) throw new Error('In der Sicherung ist kein Profil enthalten.');
  return {date:obj.date, profiles};
}
function applyBackup(b){
  for(const p of b.profiles){
    let pr=store.profiles.find(x=>x.name.toLowerCase()===p.name.toLowerCase());
    if(!pr){ pr={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), name:p.name, color:p.color}; store.profiles.push(pr); }
    pr.color=p.color;
    store.kids[pr.id]={xp:p.xp, streak:p.streak, lastDay:p.lastDay, p:p.p, d:p.d, dx:p.dx, dt:p.dt};
    store.pages[pr.id]=p.pages;
  }
  saveNow();
}

async function exportFile(){
  const json=JSON.stringify(buildBackup());
  const name='lernkasten-sicherung-'+today()+'.json';
  const file=new File([json], name, {type:'application/json'});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Lernkasten-Sicherung'}); markBackup(); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const url=URL.createObjectURL(file); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000); markBackup();
}
function markBackup(){ store.lastBackup=new Date().toISOString(); saveNow(); toast('Sicherung erstellt'); renderKeepScroll(); }
async function exportCode(){
  const code=backupCode();
  try{ await navigator.clipboard.writeText(code); S.codeShown=null; toast('Sicherungscode kopiert'); store.lastBackup=new Date().toISOString(); saveNow(); renderKeepScroll(); return; }catch(e){}

/* =====================================================================
   Deutsch: Rechtschreibung
   Lernwörter: Die App spricht ein Wort (mit Beispielsatz) vor, das Kind schreibt es.
   Diktat: Die App liest 5 oder 10 Sätze vor, das Kind schreibt Satz für Satz.
   Groß- und Kleinschreibung zählt. Falsch geschriebene Wörter landen bei „Meine Fehlerwörter“.
   ===================================================================== */
const DE = window.DEUTSCH || {topics:[], words:{}, texts:[]};
const DTOPIC = new Map(DE.topics.map(t=>[t.id,t]));
const PREFIX = /^(der|die|das|er|sie|es|ich|du|wir|ihr) (.+)$/;
const DWORDS = [], DKEY = new Map();
for(const t of DE.topics) for(const e of (DE.words[t.id]||[])){
  const w=Array.isArray(e)?e[0]:e, s=Array.isArray(e)?(e[1]||''):'';
  const key='d:'+w; if(DKEY.has(key)) continue;
  const m=w.match(PREFIX); const item={key, w, s, t:t.id, core:m?m[2]:w};
  DWORDS.push(item); DKEY.set(key,item);
}
const CORE = new Map(); DWORDS.forEach(x=>{ if(!CORE.has(x.core)) CORE.set(x.core,x); });
const lcFirst = s => s.charAt(0).toLowerCase()+s.slice(1);
const ucFirst = s => s.charAt(0).toUpperCase()+s.slice(1);
const plural = (n,one,many) => n+' '+(n===1?one:many);

function dkid(k){ k=k||kidData(); if(!k) return null; k.d=k.d||{}; k.dx=k.dx||{}; k.dt=k.dt||{}; return k; }
function dItem(key, k){
  if(key.startsWith('d:')) return DKEY.get(key)||null;
  const w=key.slice(2), x=(k||dkid()).dx[w];
  return x ? {key, w, s:x.s, t:'mine', core:w, first:!!x.f} : null;
}
const dBox = (k,key) => (k&&k.d&&k.d[key])||{b:0,due:0};
function dKeys(k){ return DWORDS.map(x=>x.key).concat(Object.keys((k&&k.dx)||{}).map(w=>'x:'+w)); }
function dCounts(k){ const c=[0,0,0,0,0,0]; dKeys(k).forEach(key=>c[dBox(k,key).b]++); return c; }
function dReview(k){ if(!k) return 0; return Object.entries(k.d||{}).filter(([key,p])=>p.b>0 && isDue(p) && (key.startsWith('d:')?DKEY.has(key):(k.dx||{})[key.slice(2)])).length; }
function dMine(k){ return Object.entries((k&&k.d)||{}).filter(([key,p])=>p.b===1).map(([key])=>dItem(key,k)).filter(Boolean); }
function dKind(k, x){ const p=dBox(k,x.key); if(p.b===0) return 'fresh'; if(p.b===1) return 'wrong'; return isDue(p)?'due':'later'; }
function dPick(pool, n, k){
  return pool.map(x=>({x, key:Math.pow(Math.random(), 1/WEIGHT[dKind(k,x)])})).sort((a,b)=>b.key-a.key).slice(0,n).map(o=>o.x);
}

/* ---------- Sprachausgabe auf Deutsch ----------
   Die Stimme kommt vom Gerät. Gewählt wird die deutlichste deutsche Stimme (erweitert/Premium zuerst),
   Spaß-Stimmen wie Eddy oder Grandpa werden gemieden. Stimme und Tempo lassen sich unter „Stimme & Tempo“ einstellen
   und bleiben auf diesem Gerät. */
const TTS_SPEED = {langsam:{f:.85, name:'Langsam'}, mittel:{f:1, name:'Mittel'}, zuegig:{f:1.15, name:'Zügig'}};
store.tts = store.tts && typeof store.tts==='object' ? store.tts : {};
const ttsSpeed = () => (TTS_SPEED[store.tts.speed]||TTS_SPEED.mittel).f;
const NOVELTY = /\b(eddy|flo|grandma|grandpa|oma|opa|reed|rocko|sandy|shelley|albert|bahh|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox|good news|bad news)\b/i;
let deVoiceCache=null, speechToken=0, speechUnlocked=false;
function deVoices(){
  try{ return speechSynthesis.getVoices().filter(v=>/^de([-_]|$)/i.test(v.lang)); }catch(e){ return []; }
}
function voiceScore(v){
  return (/^de[-_]DE/i.test(v.lang)?4:0)+(/premium/i.test(v.name)?6:0)+(/enhanced|erweitert|verbessert|natural|neural/i.test(v.name)?5:0)
    +(/anna|helena|petra|markus|martin|yannick|google/i.test(v.name)?2:0)+(v.localService?1:0)-(NOVELTY.test(v.name)?20:0);
}
const isGoodVoice = v => /premium|enhanced|erweitert|verbessert|natural|neural/i.test(v.name);
function deVoice(){
  if(deVoiceCache) return deVoiceCache;
  const vs=deVoices(); if(!vs.length) return null;
  const chosen=store.tts.voice && vs.find(v=>v.voiceURI===store.tts.voice||v.name===store.tts.voice);
  deVoiceCache=chosen || vs.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]; return deVoiceCache;
}
if(canSpeak){ try{ speechSynthesis.addEventListener('voiceschanged', ()=>{ deVoiceCache=null; if(S.view==='voice') renderKeepScroll(); }); }catch(e){} }
/* list: Texte, {t, r} mit eigener Geschwindigkeit oder Zahlen als Pause in ms */
function speakDE(list, rate){
  if(!canSpeak) return; const tok=++speechToken;
  try{ speechSynthesis.cancel(); }catch(e){}
  let i=0;
  const next=()=>{
    if(tok!==speechToken || i>=list.length) return;
    const item=list[i++];
    if(typeof item==='number'){ setTimeout(next,item); return; }
    const text=typeof item==='string'?item:item.t, r=(typeof item==='string'?(rate||.85):item.r)*ttsSpeed();
    try{
      const u=new SpeechSynthesisUtterance(text); u.lang='de-DE'; const v=deVoice(); if(v){ u.voice=v; u.lang=v.lang; }
      u.rate=Math.max(.5,Math.min(1.2,r)); u.pitch=1; u.volume=1;
      let done=false; const fin=()=>{ if(done) return; done=true; next(); };
      u.onstart=()=>{ speechUnlocked=true; }; u.onend=fin; u.onerror=fin; speechSynthesis.speak(u);
    }catch(e){}
  };
  /* iOS verschluckt nach cancel() gern den Anfang. Nach dem ersten Vorlesen (Freigabe durch Antippen) kurz warten. */
  if(speechUnlocked) setTimeout(next,180); else next();
}
function stopSpeech(){ speechToken++; if(canSpeak){ try{ speechSynthesis.cancel(); }catch(e){} } }
function speakWord(it, slow){
  const r=slow?.62:.8, w=it.first?lcFirst(it.w):it.w;
  speakDE(it.s ? [{t:w,r}, 800, {t:it.s,r:slow?.68:.82}, 800, {t:w,r}] : [{t:w,r}, 1000, {t:w,r}]);
}

/* ---------- Prüfen ---------- */
const cleanIn = s => (s||'').replace(/[’‘`´]/g,"'").replace(/\s+/g,' ').trim().replace(/[.!?]+$/,'').trim();
function dCheck(input, it){
  const a=cleanIn(input); if(!a) return false;
  const ok=[it.w, it.core]; if(it.first) ok.push(lcFirst(it.w));
  return ok.includes(a);
}
/* Buchstaben, die im Wort fehlen oder falsch sind, werden markiert (Vergleich per LCS) */
function markWord(target, typed){
  const a=[...target], b=[...(typed||'')], n=a.length, m=b.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const keep=new Array(n).fill(false); let i=0,j=0;
  while(i<n&&j<m){ if(a[i]===b[j]){ keep[i]=true; i++; j++; } else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  return a.map((c,k)=>keep[k]||c===' '?esc(c):`<mark>${esc(c)}</mark>`).join('');
}

/* ---------- Lernwörter: Auswahl und Übung ---------- */
const D_COUNTS=[10,15,20,30];
function dSel(){ const k=dkid(); if(!S.dsel) S.dsel=new Set(k.dsel&&k.dsel.length?k.dsel:['fehler']); return S.dsel; }
function dPool(){
  const k=dkid(), sel=dSel(), seen=new Set(), pool=[];
  const add=x=>{ if(x && !seen.has(x.key)){ seen.add(x.key); pool.push(x); } };
  if(sel.has('mine')) dMine(k).forEach(add);
  DWORDS.forEach(x=>{ if(sel.has(x.t)) add(x); });
  return pool;
}
function dStart(pool, n){
  const k=dkid(); if(!pool.length){ toast('Wähle zuerst einen Bereich aus.'); return false; }
  n=Math.min(n||pool.length, pool.length);
  S.ds={items:shuffle(dPick(pool,n,k)), i:0, res:[], verdict:null, spoken:-1};
  return true;
}
function dGrade(right, typed){
  const s=S.ds, it=s.items[s.i], k=dkid();
  const p=k.d[it.key]||{b:0,due:0}; const b= right ? (p.b===0?2:Math.min(5,p.b+1)) : 1;
  k.d[it.key]={b, due:startOfDay()+INTERVAL[b]*DAY};
  k.xp=(k.xp||0)+(right?10:0); touchDay(k);
  s.verdict={item:it, r:right?'right':'wrong', from:p.b, to:b, typed}; s.res.push(s.verdict); save();
}
function dSubmit(){
  const s=S.ds, inp=document.getElementById('danswer'); if(!s) return;
  if(s.verdict){ s.i++; s.verdict=null; if(s.i>=s.items.length){ inp.blur(); go('ddone'); } else render(); return; }
  const val=inp.value; if(!val.trim()){ inp.focus(); return; }
  stopSpeech(); dGrade(dCheck(val, s.items[s.i]), cleanIn(val)); render();
}

/* ---------- Diktat ---------- */
function splitParts(sentence){
  /* Teile enden an Komma oder Doppelpunkt, lange Stücke werden in Gruppen von 3–4 Wörtern geteilt */
  const segs=[], parts=[]; let cur=[];
  for(const w of sentence.split(' ')){ cur.push(w); if(/[,:]$/.test(w)){ segs.push(cur.join(' ')); cur=[]; } }
  if(cur.length) segs.push(cur.join(' '));
  for(const seg of segs){
    const w=seg.split(' ');
    if(w.length<=5){ parts.push(seg); continue; }
    const n=Math.ceil(w.length/4), size=Math.ceil(w.length/n);
    for(let i=0;i<w.length;i+=size) parts.push(w.slice(i,i+size).join(' '));
  }
  return parts;
}
function speakSentence(mode, idx){
  const s=S.dc; if(!s) return; const sent=s.sents[s.i], parts=splitParts(sent);
  if(mode==='part'){ speakDE([{t:parts[idx],r:.7}]); return; }
  if(mode==='full'){ speakDE([{t:sent,r:.8}]); return; }
  const seq=[]; parts.forEach((p,i)=>{ if(i) seq.push(1400+450*p.split(' ').length); seq.push({t:p,r:.7}); });
  if(mode==='slow'){ speakDE(seq); return; }
  const pre = hasSpeech(sent) ? [{t:'Achtung, in diesem Satz gibt es wörtliche Rede.', r:.85}, 900] : [];
  speakDE([...pre, {t:sent,r:.8}, 1500, ...seq]);       // auto: ggf. Hinweis, dann der ganze Satz, dann in Teilen
}
const levelOf = t => t.level||'normal';
const hasSpeech = s => /[„“"]/.test(s);
function dLevel(){ const k=dkid(); if(!S.dlevel) S.dlevel=k.dlevel||'normal'; return S.dlevel; }
function pickDict(n){
  const k=dkid(), now=Date.now(), lv=dLevel(), texts=DE.texts.filter(t=>levelOf(t)===lv && (!S.dtext||t.id===S.dtext));
  const cand=[];
  for(const t of texts){
    if(n===10) cand.push({t, half:'ab', last:Math.max(k.dt[t.id+':a']||0, k.dt[t.id+':b']||0)});
    else ['a','b'].forEach(h=>cand.push({t, half:h, last:k.dt[t.id+':'+h]||0}));
  }
  const min=Math.min(...cand.map(c=>c.last)); const best=cand.filter(c=>c.last===min);
  const c=best[Math.floor(Math.random()*best.length)];
  const sents=c.half==='ab'?c.t.a.concat(c.t.b):c.t[c.half];
  S.dc={text:c.t, half:c.half, sents, i:0, res:[], verdict:null, spoken:-1, started:now};
}
const TOK=/[A-Za-zÄÖÜäöüßÀ-ÿ]+(?:-[A-Za-zÄÖÜäöüßÀ-ÿ]+)*|\d+|[.,!?;:„“”"«»]/g;
const toks = s => (String(s||'').match(TOK)||[]);
const isQuote = t => /^[„“”"«»]$/.test(t);
const isWordTok = t => !/^[.,!?;:]$/.test(t) && !isQuote(t);
const tokNorm = t => isQuote(t) ? '"' : t;      // „ “ ” und " gelten als gleich
function alignTokens(E, T){
  const n=E.length, m=T.length, D=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  const subCost=(a,b)=>tokNorm(a)===tokNorm(b)?0:(isWordTok(a)===isWordTok(b)?1:3);
  for(let i=0;i<=n;i++) D[i][0]=i; for(let j=0;j<=m;j++) D[0][j]=j;
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) D[i][j]=Math.min(D[i-1][j-1]+subCost(E[i-1],T[j-1]), D[i-1][j]+1, D[i][j-1]+1);
  const ops=[]; let i=n, j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&D[i][j]===D[i-1][j-1]+subCost(E[i-1],T[j-1])){ ops.push({op:tokNorm(E[i-1])===tokNorm(T[j-1])?'eq':'sub', e:i-1, t:j-1}); i--; j--; }
    else if(i>0&&D[i][j]===D[i-1][j]+1){ ops.push({op:'del', e:i-1}); i--; }
    else { ops.push({op:'ins', t:j-1}); j--; }
  }
  return ops.reverse();
}
function gradeSentence(expected, typed){
  const E=toks(expected), T=toks(typed), ops=alignTokens(E,T);
  const eCls=new Array(E.length).fill(''), tCls=new Array(T.length).fill(''); const errWords=[]; let words=0, punct=0, caseOnly=0;
  for(const o of ops){
    if(o.op==='eq') continue;
    /* Ein Komma vor „und“/„oder“ zwischen zwei Hauptsätzen ist freigestellt und zählt nicht als Fehler */
    if(o.op==='ins' && T[o.t]===',' && /^(und|oder)$/.test(T[o.t+1]||'')) continue;
    const et=o.e!=null?E[o.e]:null, tt=o.t!=null?T[o.t]:null;
    const isW = et!=null ? isWordTok(et) : isWordTok(tt);
    if(isW){ words++; if(o.e!=null){ eCls[o.e]='bad'; errWords.push({w:et, first:o.e===0||isQuote(E[o.e-1]||'')}); } if(o.t!=null) tCls[o.t]='bad';
      if(et&&tt&&et.toLowerCase()===tt.toLowerCase()) caseOnly++; }
    else { punct++; if(o.e!=null) eCls[o.e]='pun'; if(o.t!=null) tCls[o.t]='pun'; }
  }
  return {E, T, eCls, tCls, words, punct, caseOnly, errWords};
}
function joinToks(arr, cls){
  let open=false, prevOpen=false, out='';
  arr.forEach((t,i)=>{
    const q=isQuote(t); let opening=false;
    if(q){ opening = t==='„'||t==='«' ? true : (t==='“'||t==='”'||t==='»') ? false : !open; open=opening; }
    const sp = !i||prevOpen ? '' : (isWordTok(t) || (q&&opening)) ? ' ' : '';
    out += sp + (cls[i]?`<span class="${cls[i]}">${esc(t)}</span>`:esc(t));
    prevOpen = q&&opening;
  });
  return out;
}
function noteErrorWords(errWords, sentence){
  const k=dkid();
  for(const {w, first} of errWords){
    const hit=CORE.get(w) || (first?CORE.get(lcFirst(w)):null);
    if(hit){ k.d[hit.key]={b:1, due:0}; continue; }
    if(!k.dx[w]) k.dx[w]={s:sentence, f:first};
    k.d['x:'+w]={b:1, due:0};
  }
}

  </section>
  <section class="panel"><span class="label">Deutsche Stimmen auf diesem Gerät</span>
    ${vs.length?`<div class="topiclist">${vs.map(v=>`<button class="topic" aria-pressed="${!!cur&&cur.voiceURI===v.voiceURI}" data-act="v-pick" data-id="${esc(v.voiceURI)}"><span><b>${esc(v.name)}</b><small>${isGoodVoice(v)?'besonders deutlich':NOVELTY.test(v.name)?'Spaß-Stimme, eher undeutlich':'Standard'}</small></span><span class="cnt" aria-hidden="true">▶</span></button>`).join('')}</div>`
      :'<p class="small muted">Keine deutsche Stimme gefunden.</p>'}
    <button class="btn btn-ghost btn-wide" data-act="v-test">${EAR_ICON} Probehören</button>
  </section>
  <section class="panel"><h3>${good?'Noch deutlicher':'Deutlichere Stimme laden'}</h3>
    <p class="small">Auf dem iPhone oder iPad gibt es kostenlose, viel deutlichere Stimmen zum Herunterladen:</p>
    <p class="small"><b>Einstellungen → Bedienungshilfen → Gesprochene Inhalte → Stimmen → Deutsch</b>. Dort eine Stimme mit dem Zusatz <b>„Erweitert“</b> oder <b>„Premium“</b> laden, zum Beispiel Anna. Danach den Lernkasten neu öffnen und die Stimme hier auswählen.</p>
  </section>`;
}

/* ---------- Bedienung Deutsch ---------- */
function deAction(act, el){
  const k=kidData() && dkid();
  switch(act){
    case 'to-en': go('home'); break;
    case 'to-de': go('de'); break;
    case 'to-dwords': S.dsel=null; go('dwords'); break;
    case 'to-dict': go('dictpick'); break;
    case 'to-voice': go('voice'); break;
    case 'v-speed': store.tts.speed=el.dataset.id; saveNow(); renderKeepScroll(); speakDE([VOICE_TEST]); break;
    case 'v-pick': store.tts.voice=el.dataset.id; deVoiceCache=null; saveNow(); renderKeepScroll(); speakDE([VOICE_TEST]); break;
    case 'v-test': speakDE([VOICE_TEST]); break;
    case 'd-topic': { const sel=dSel(), id=el.dataset.id; sel.has(id)?sel.delete(id):sel.add(id); k.dsel=[...sel].filter(x=>x!=='mine'); save(); renderKeepScroll(); break; }
    case 'd-count': S.dn=+el.dataset.n; k.dn=S.dn; save(); renderKeepScroll(); break;
    case 'd-start': { const pool=dPool(); if(dStart(pool, Math.min(S.dn||k.dn||10, pool.length))) go('dpractice'); break; }
    case 'd-mine': { const pool=dMine(k); if(!pool.length){ toast('Du hast gerade keine Fehlerwörter.'); break; } if(dStart(pool, Math.min(20,pool.length))) go('dpractice'); break; }
    case 'd-say': { const s=S.ds; if(s) speakWord(s.items[s.i]); break; }
    case 'd-slow': { const s=S.ds; if(s) speakWord(s.items[s.i], true); break; }
    case 'd-quit': go(S.ds && S.ds.res.length ? 'ddone' : 'de'); break;
    case 'd-retry': { const wrong=S.ds.res.filter(r=>r.r!=='right').map(r=>r.item); S.ds={items:shuffle(wrong), i:0, res:[], verdict:null, spoken:-1}; go('dpractice'); break; }
    case 'd-text': S.dtext=el.dataset.id||null; renderKeepScroll(); break;
    case 'd-level': S.dlevel=el.dataset.id; k.dlevel=S.dlevel; save(); { const t=DE.texts.find(x=>x.id===S.dtext); if(t && levelOf(t)!==S.dlevel) S.dtext=null; } renderKeepScroll(); break;
    case 'dict-start': pickDict(+el.dataset.n); go('dict'); break;
    case 'dict-say': speakSentence(el.dataset.mode, +el.dataset.i||0); break;
    case 'dict-quit': if(S.dc && S.dc.res.length){ finishDict(); go('dictdone'); } else go('dictpick'); break;
  }
}
/* Return im Diktat-Feld prüft den Satz (statt eine neue Zeile zu beginnen) */
document.addEventListener('keydown', ev=>{
  if(ev.target && ev.target.id==='dcin' && ev.key==='Enter' && !ev.shiftKey && !ev.isComposing){ ev.preventDefault(); dictSubmit(); }
});

function render(){
  if(S.kidId && !kidInfo()){ S.kidId=null; S.view='pick'; }
  const info=kidInfo();
  app.className='app acc-'+((S.view==='profile'||(S.view==='pick'&&!store.profiles.length))&&S.form ? S.form.color : colorOf(info));
  if(S.view==='practice' && app.dataset.view==='practice'){ updatePractice(); return; }
  if(S.view==='dpractice' && app.dataset.view==='dpractice'){ updateDPractice(); return; }
  if(S.view==='dict' && app.dataset.view==='dict'){ updateDict(); return; }
  app.dataset.view=S.view;
  app.innerHTML = S.view==='hub'?viewHub() : S.view==='voice'?viewVoice() : S.view==='de'?viewDe() : S.view==='dwords'?viewDWords() : S.view==='dpractice'?viewDPractice() : S.view==='ddone'?viewDDone() : S.view==='dictpick'?viewDictPick() : S.view==='dict'?viewDict() : S.view==='dictdone'?viewDictDone() : S.view==='home'?viewHome() : S.view==='pages'?viewPages() : S.view==='count'?viewCount() : S.view==='boxes'?viewBoxes() : S.view==='practice'?viewPractice() : S.view==='done'?viewDone() : S.view==='profile'?viewProfileForm(false) : S.view==='backup'?viewBackup() : viewPick();
  if(S.view==='practice') updatePractice();
  if(S.view==='dpractice') updateDPractice();
  if(S.view==='dict') updateDict();
}
function renderKeepScroll(){ const y=window.scrollY; render(); window.scrollTo(0,y); }
function go(view){ document.getElementById('toast').hidden=true; if(view!=='dpractice'&&view!=='dict') stopSpeech(); S.view=view; render(); window.scrollTo(0,0); }

/* ---------- Bedienung ---------- */
document.addEventListener('mousedown', ev=>{ if(ev.target.closest('[data-keepfocus]')) ev.preventDefault(); });
document.addEventListener('click', ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  switch(act){
    case 'pick': openKid(id); go('hub'); break;
    case 'hub': go(S.kidId?'hub':'pick'); break;
    case 'back-pick': S.kidId=null; go('pick'); break;
    case 'home': go(S.kidId?'home':'pick'); break;
    case 'choose-pages': go('pages'); break;
    case 'page': { const p=+el.dataset.page; S.pages.has(p)?S.pages.delete(p):S.pages.add(p); renderKeepScroll(); break; }
    case 'unit-pages': { const g=PAGE_INDEX.find(g=>g.unit.id===id); if(!g) break; const allOn=g.pages.every(p=>S.pages.has(p.page));
      g.pages.forEach(p=>allOn?S.pages.delete(p.page):S.pages.add(p.page)); renderKeepScroll(); break; }
    case 'clear-pages': S.pages.clear(); renderKeepScroll(); break;
    case 'to-count': { const next=afterPages(); if(next) go(next); break; }
    case 'to-boxes': go('boxes'); break;
    case 'box-yes': S.withBox=true; if(openCount()) go('count'); break;
    case 'box-no': S.withBox=false; if(startWithoutBoxes()) go('practice'); break;
    case 'count-minus': S.count=clampCount(S.count===S.countTotal&&S.count%STEP ? Math.floor(S.count/STEP)*STEP : S.count-STEP, S.countTotal); renderKeepScroll(); break;
    case 'count-plus': S.count=clampCount(S.count+STEP, S.countTotal); renderKeepScroll(); break;
    case 'count-set': S.count=clampCount(+el.dataset.n, S.countTotal); renderKeepScroll(); break;
    case 'start': if(startSession()) go('practice'); break;
    case 'speak': speak(el.dataset.text); break;
    case 'quit': go(S.sess.res.length ? 'done' : 'pages'); break;
    case 'retry': startRetry(); go('practice'); break;
    case 'new-profile': S.form={id:null,name:'',color:freeColor()}; S.confirmDel=false; go('profile'); break;
    case 'edit-profile': { const p=kidInfo(); S.form={id:p.id,name:p.name,color:colorOf(p)}; S.confirmDel=false; go('profile'); break; }
    case 'color': if(S.form){ S.form.color=el.dataset.color; renderKeepScroll(); } break;
    case 'del-profile': S.confirmDel=true; renderKeepScroll(); break;
    case 'del-no': S.confirmDel=false; renderKeepScroll(); break;
    case 'backup': S.importing=null; S.codeShown=null; go('backup'); break;
    case 'export-file': exportFile(); break;
    case 'export-code': exportCode(); break;
    case 'import-no': S.importing=null; renderKeepScroll(); break;
    case 'import-yes': { const n=S.importing.profiles.length; applyBackup(S.importing); S.importing=null;
      if(S.kidId && !profileOf(S.kidId)) S.kidId=null;
      toast(n===1?'Lernstand übernommen':`${n} Profile übernommen`); go(S.kidId?'hub':'pick'); break; }
    default: deAction(act, el); break;
    case 'del-yes': { const id=S.form.id; store.profiles=store.profiles.filter(p=>p.id!==id); delete store.kids[id]; delete store.pages[id];
      if(store.last===id) store.last=null; saveNow(); S.kidId=null; S.form=null; S.confirmDel=false; toast('Profil gelöscht'); go('pick'); break; }
  }
});
document.addEventListener('change', async ev=>{
  if(ev.target.id!=='importfile') return;
  const f=ev.target.files && ev.target.files[0]; if(!f) return;
  try{ startImport(await f.text()); }catch(e){ toast('Die Datei konnte nicht gelesen werden.'); }
  ev.target.value='';
});
document.addEventListener('input', ev=>{
  if(ev.target.id==='from') S.from=ev.target.value; if(ev.target.id==='to') S.to=ev.target.value;
  if(ev.target.id==='pname' && S.form) S.form.name=ev.target.value;
});
document.addEventListener('submit', ev=>{
  ev.preventDefault(); const f=ev.target.dataset.form;
  if(f==='import'){ startImport(document.getElementById('codein').value); return; }
  if(f==='profile'){
    const name=(S.form.name||'').trim().replace(/\s+/g,' ');
    if(!name){ toast('Bitte gib deinen Namen ein.'); document.getElementById('pname').focus(); return; }
    document.activeElement && document.activeElement.blur();
    if(S.form.id){ const p=profileOf(S.form.id); p.name=name; p.color=S.form.color; saveNow(); S.form=null; toast('Gespeichert'); go('hub'); }
    else { const id=createProfile(name, S.form.color); S.form=null; openKid(id); go('hub'); }
    return;
  }
  if(f==='type'){
    const s=S.sess, inp=document.getElementById('answer');
    if(s.verdict){ s.i++; s.verdict=null; if(s.i>=s.items.length){ inp.blur(); go('done'); } else render(); return; }
    const val=inp.value; if(!val.trim()){ inp.focus(); return; }
    grade(checkAnswer(val,s.items[s.i].w), val.trim()); render();
  }
  if(f==='dtype'){ dSubmit(); return; }
  if(f==='dict'){ dictSubmit(); return; }
  if(f==='range'){ const a=parseInt(S.from,10), b=parseInt(S.to||S.from,10);
    if(!a){ toast('Gib eine Seitenzahl ein, z. B. 189 bis 195.'); return; }
    document.activeElement && document.activeElement.blur();
    const lo=Math.min(a,b), hi=Math.max(a,b); const avail=new Set(ALL.map(x=>x.w.page||0)); let added=0;
    for(let p=lo;p<=hi;p++) if(avail.has(p)){ S.pages.add(p); added++; }
    toast(added?`${added} ${added===1?'Seite':'Seiten'} ausgewählt`:`Auf S. ${lo}${hi>lo?'–'+hi:''} stehen keine Vokabeln.`); renderKeepScroll(); }
});

/* ---------- Start ---------- */
if(store.last && profileOf(store.last)) openKid(store.last);
render();
if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
